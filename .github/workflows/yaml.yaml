name: Lint YAML
on:
  push:
    branches:
      - main
    paths:
      - "**/*.yaml"
      - ".github/.yamllint.yaml"
      - "mise.toml"
  pull_request:
    paths:
      - "**/*.yaml"
      - ".github/.yamllint.yaml"
      - "mise.toml"
permissions: {}
jobs:
  lint:
    name: Lint YAML
    timeout-minutes: 3
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: '2026.10.25'
          cache: true
      - name: Lint YAML
        run: mise run --raw lint-yaml
